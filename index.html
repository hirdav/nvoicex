<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>invoiceX</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0;
    --ink:#1F2421;
    --ink-soft:#5A5F58;
    --line:#D8D2C4;
    --accent:#1B4B43;
    --accent-soft:#E4EDE9;
    --danger:#A13D2B;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDE8DC;
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding:32px 16px 80px;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0;}
  .toolbar{
    max-width:820px;
    margin:0 auto 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
  }
  .toolbar-title{font-size:14px; color:var(--ink-soft); letter-spacing:.02em;}
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:#F2EEE4;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn-primary:hover{background:#153B35;}
  .sheet{
    max-width:820px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    padding:48px 48px 40px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .head-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:24px;
    margin-bottom:28px;
  }
  .brand-name{
    font-size:26px;
    border:none;
    background:transparent;
    color:var(--ink);
    width:100%;
    padding:0;
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
  }
  .invoice-tag{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
  }
  .invoice-tag .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .invoice-tag .num{
    font-size:20px;
    font-weight:600;
    color:var(--accent);
  }
  input, textarea{
    font-family:inherit;
    font-size:14px;
    border:none;
    border-bottom:1px dashed var(--line);
    background:transparent;
    color:var(--ink);
    padding:4px 2px;
    width:100%;
    outline:none;
  }
  input:focus, textarea:focus{border-bottom:1px solid var(--accent);}
  input::placeholder, textarea::placeholder{color:#B7B2A4;}
  .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:32px;
    margin-bottom:28px;
  }
  .col-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:8px;
    font-weight:600;
  }
  .field-line{margin-bottom:8px;}
  .dates{
    display:flex;
    gap:20px;
    margin-bottom:28px;
  }
  .date-field{flex:1;}
  .date-field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:600;
  }
  .date-input-wrap{position:relative;}
  .date-input-wrap input[type="text"]{padding-right:24px;}
  .date-pick-btn{
    position:absolute; right:0; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:13px; padding:2px 4px; line-height:1;
  }
  .hidden-date-picker{
    position:absolute; opacity:0; width:1px; height:1px; padding:0; margin:0;
    border:none; pointer-events:none; left:0; top:0;
  }
  table{width:100%; border-collapse:collapse; margin-bottom:8px;}
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    font-weight:600;
    padding:0 6px 8px;
    border-bottom:1px solid var(--ink);
  }
  th.num-col, td.num-col{text-align:right; width:90px;}
  th.amt-col, td.amt-col{text-align:right; width:110px;}
  th.rm-col, td.rm-col{width:32px;}
  tbody td{
    padding:8px 6px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody td input{font-family:'JetBrains Mono',monospace; font-size:13px;}
  tbody td.desc-col input{font-family:inherit; font-size:14px;}
  .amount-cell{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding-top:12px;
    display:block;
  }
  .rm-btn{
    border:none;
    background:transparent;
    color:var(--danger);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:6px;
  }
  .rm-btn:hover{opacity:.7;}
  .add-row-btn{
    font-size:13px;
    color:var(--accent);
    background:transparent;
    border:none;
    cursor:pointer;
    padding:8px 6px;
    font-weight:600;
  }
  .add-row-btn:hover{text-decoration:underline;}
  .totals-block{
    margin-left:auto;
    width:280px;
    margin-top:16px;
  }
  .totals-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:14px;
    font-family:'JetBrains Mono',monospace;
    border-bottom:1px dotted var(--line);
  }
  .totals-row.grand{
    border-bottom:none;
    border-top:2px solid var(--ink);
    margin-top:6px;
    padding-top:12px;
    font-size:18px;
    font-weight:700;
    color:var(--accent);
    font-family:'Fraunces',Georgia,serif;
  }
  .totals-row label{
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .totals-row input{
    width:100px;
    text-align:right;
  }
  .notes-block{
    margin-top:36px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .notes-block .col-label{margin-bottom:8px;}
  .notes-block textarea{
    resize:vertical;
    min-height:56px;
    border-bottom:none;
    border:1px dashed var(--line);
    border-radius:4px;
    padding:8px;
  }
  select{
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
  }
  @media print{
    body{background:#fff; padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; border:none; max-width:100%; padding:24px 32px;}
    input, textarea{border-bottom:none;}
    .rm-btn, .add-row-btn, .date-pick-btn{display:none;}
  }
  @media (max-width:640px){
    .two-col{grid-template-columns:1fr;}
    .sheet{padding:28px 20px;}
    .head-row{flex-direction:column;}
    .invoice-tag{text-align:left;}
  }
  .btn-drive{position:relative;}
  .btn-drive.connected{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .history-panel{
    max-width:820px; margin:0 auto 20px; background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:20px 24px; display:none;
  }
  .history-panel.open{display:block;}
  .history-panel h3{font-size:15px; margin-bottom:14px;}
  .history-table{width:100%; border-collapse:collapse; font-size:13px;}
  .history-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); padding:0 8px 8px; border-bottom:1px solid var(--ink);
  }
  .history-table td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .history-table td.num{text-align:right; font-family:'JetBrains Mono',monospace;}
  .status-pill{
    font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .status-pill.draft{background:#EFE7D0; color:#8A6D1D;}
  .status-pill.sent{background:var(--accent-soft); color:var(--accent);}
  .history-empty{color:var(--ink-soft); font-size:13px; padding:8px 0;}
  .link-btn{
    border:none; background:transparent; color:var(--accent); cursor:pointer;
    font-size:12px; font-weight:600; padding:2px 4px;
  }
  .link-btn:hover{text-decoration:underline;}
  .link-btn.danger{color:var(--danger);}
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">invoiceX — no tax, keep it simple</span>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <select id="currency">
      <option value="₹">₹ INR</option>
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="£">£ GBP</option>
    </select>
    <button class="btn" onclick="newInvoice()">+ New invoice</button>
    <button class="btn" id="driveBtn" onclick="toggleDriveConnection()">Connect Google Drive</button>
    <button class="btn" onclick="toggleHistory()">History</button>
    <button class="btn" onclick="saveDraft()">Save draft</button>
    <button class="btn btn-primary" onclick="handleDownloadPdf(event)">Download / print PDF</button>
  </div>
</div>

<div class="history-panel" id="historyPanel">
  <h3>Invoice history</h3>
  <table class="history-table">
    <thead>
      <tr>
        <th>Invoice #</th>
        <th>Client</th>
        <th>Date</th>
        <th style="text-align:right;">Total</th>
        <th>Status</th>
        <th>Delivered</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
  <div class="history-empty" id="historyEmpty" style="display:none;">No invoices yet — save a draft or download a PDF to start tracking history.</div>
</div>

<div class="sheet" id="sheet">
  <div class="head-row">
    <div style="flex:1;">
      <input class="brand-name" id="bizName" placeholder="Your business name" value="">
      <div class="field-line"><input id="bizAddr" placeholder="Address, city"></div>
      <div class="field-line"><input id="bizContact" placeholder="Phone / email"></div>
    </div>
    <div class="invoice-tag">
      <div class="label">Invoice</div>
      <div class="num"><input id="invNum" style="text-align:right; font-size:20px; font-weight:600; color:var(--accent); border:none;" value="INV-0001"></div>
    </div>
  </div>

  <div class="two-col">
    <div>
      <div class="col-label">Billed by</div>
      <div class="field-line"><input id="fromName" placeholder="Name"></div>
      <div class="field-line"><input id="fromGSTless" placeholder="Reference / ID (optional)"></div>
    </div>
    <div>
      <div class="col-label">Billed to</div>
      <div class="field-line"><input id="toName" placeholder="Client name"></div>
      <div class="field-line"><input id="toAddr" placeholder="Client address"></div>
      <div class="field-line"><input id="toContact" placeholder="Client phone / email"></div>
    </div>
  </div>

  <div class="dates">
    <div class="date-field">
      <label>Issue date</label>
      <div class="date-input-wrap">
        <input type="text" id="issueDate" placeholder="DD/MM/YY" maxlength="8" inputmode="numeric" oninput="handleDateTyping(this)">
        <button type="button" class="date-pick-btn" onclick="openDatePicker('issueDatePicker')" aria-label="Pick issue date">📅</button>
        <input type="date" id="issueDatePicker" class="hidden-date-picker" tabindex="-1" onchange="syncDateFromPicker('issueDatePicker','issueDate')">
      </div>
    </div>
    <div class="date-field">
      <label>Due date</label>
      <div class="date-input-wrap">
        <input type="text" id="dueDate" placeholder="DD/MM/YY" maxlength="8" inputmode="numeric" oninput="handleDateTyping(this)">
        <button type="button" class="date-pick-btn" onclick="openDatePicker('dueDatePicker')" aria-label="Pick due date">📅</button>
        <input type="date" id="dueDatePicker" class="hidden-date-picker" tabindex="-1" onchange="syncDateFromPicker('dueDatePicker','dueDate')">
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th class="num-col">Qty</th>
        <th class="num-col">Rate</th>
        <th class="amt-col">Amount</th>
        <th class="rm-col"></th>
      </tr>
    </thead>
    <tbody id="lineItems"></tbody>
  </table>
  <button class="add-row-btn" onclick="addRow()">+ Add line item</button>

  <div class="totals-block">
    <div class="totals-row">
      <label>Subtotal</label>
      <span id="subtotalOut">0.00</span>
    </div>
    <div class="totals-row">
      <label>Discount</label>
      <input type="number" id="discount" value="0" min="0" step="0.01" oninput="calcTotals()">
    </div>
    <div class="totals-row grand">
      <label style="font-family:'Inter',sans-serif; font-size:14px; font-weight:600; color:var(--ink);">Total due</label>
      <span id="totalOut">0.00</span>
    </div>
  </div>

  <div class="notes-block">
    <div class="col-label">Notes / payment terms</div>
    <textarea id="notes" placeholder="e.g. Payment due within 15 days via bank transfer. Thank you for your business."></textarea>
  </div>
</div>

<script>
let rowCount = 0;
const lineItemsEl = document.getElementById('lineItems');
const currencyEl = document.getElementById('currency');

function fmt(n){
  if(isNaN(n)) n = 0;
  return n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

function addRow(desc='', qty=1, rate=0){
  rowCount++;
  const id = 'row'+rowCount;
  const tr = document.createElement('tr');
  tr.id = id;
  tr.innerHTML = `
    <td class="desc-col"><input type="text" placeholder="Item or service description" value="${desc}" oninput="calcTotals()"></td>
    <td class="num-col"><input type="number" min="0" step="0.01" value="${qty}" oninput="calcTotals()"></td>
    <td class="num-col"><input type="number" min="0" step="0.01" value="${rate}" oninput="calcTotals()"></td>
    <td class="amt-col"><span class="amount-cell">0.00</span></td>
    <td class="rm-col"><button class="rm-btn" onclick="removeRow('${id}')" aria-label="Remove item">✕</button></td>
  `;
  lineItemsEl.appendChild(tr);
  calcTotals();
}

function removeRow(id){
  const row = document.getElementById(id);
  if(row) row.remove();
  calcTotals();
}

function calcTotals(){
  let subtotal = 0;
  const rows = lineItemsEl.querySelectorAll('tr');
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input[type="number"]');
    const qty = parseFloat(inputs[0].value) || 0;
    const rate = parseFloat(inputs[1].value) || 0;
    const amount = qty * rate;
    row.querySelector('.amount-cell').textContent = fmt(amount);
    subtotal += amount;
  });
  const discount = parseFloat(document.getElementById('discount').value) || 0;
  const total = Math.max(subtotal - discount, 0);
  document.getElementById('subtotalOut').textContent = currencyEl.value + fmt(subtotal);
  document.getElementById('totalOut').textContent = currencyEl.value + fmt(total);
}

currencyEl.addEventListener('change', calcTotals);

/* ---------- date formatting: DD/MM/YY everywhere ---------- */

function pad2(n){ return String(n).padStart(2, '0'); }

function formatDMY(date){
  return `${pad2(date.getDate())}/${pad2(date.getMonth()+1)}/${String(date.getFullYear()).slice(-2)}`;
}

function isoToDMY(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y.slice(-2)}`;
}

function handleDateTyping(input){
  let digits = input.value.replace(/[^\d]/g, '').slice(0, 6);
  let out = digits;
  if(digits.length > 4) out = digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4);
  else if(digits.length > 2) out = digits.slice(0,2) + '/' + digits.slice(2);
  input.value = out;
}

function openDatePicker(pickerId){
  const picker = document.getElementById(pickerId);
  if(picker.showPicker) picker.showPicker();
  else picker.click();
}

function syncDateFromPicker(pickerId, textId){
  const picker = document.getElementById(pickerId);
  if(picker.value) document.getElementById(textId).value = isoToDMY(picker.value);
}

// set default dates
const today = new Date();
document.getElementById('issueDate').value = formatDMY(today);
const due = new Date();
due.setDate(due.getDate()+15);
document.getElementById('dueDate').value = formatDMY(due);

// seed with 2 blank rows
addRow();
addRow();

/* ---------- state capture / restore ---------- */

function getState(){
  const items = Array.from(lineItemsEl.querySelectorAll('tr')).map(row => {
    const inputs = row.querySelectorAll('input');
    return { desc: inputs[0].value, qty: inputs[1].value, rate: inputs[2].value };
  });
  return {
    bizName: document.getElementById('bizName').value,
    bizAddr: document.getElementById('bizAddr').value,
    bizContact: document.getElementById('bizContact').value,
    invNum: document.getElementById('invNum').value,
    fromName: document.getElementById('fromName').value,
    fromGSTless: document.getElementById('fromGSTless').value,
    toName: document.getElementById('toName').value,
    toAddr: document.getElementById('toAddr').value,
    toContact: document.getElementById('toContact').value,
    issueDate: document.getElementById('issueDate').value,
    dueDate: document.getElementById('dueDate').value,
    currency: currencyEl.value,
    discount: document.getElementById('discount').value,
    notes: document.getElementById('notes').value,
    items
  };
}

function loadState(data){
  document.getElementById('bizName').value = data.bizName || '';
  document.getElementById('bizAddr').value = data.bizAddr || '';
  document.getElementById('bizContact').value = data.bizContact || '';
  document.getElementById('invNum').value = data.invNum || '';
  document.getElementById('fromName').value = data.fromName || '';
  document.getElementById('fromGSTless').value = data.fromGSTless || '';
  document.getElementById('toName').value = data.toName || '';
  document.getElementById('toAddr').value = data.toAddr || '';
  document.getElementById('toContact').value = data.toContact || '';
  document.getElementById('issueDate').value = data.issueDate || '';
  document.getElementById('dueDate').value = data.dueDate || '';
  currencyEl.value = data.currency || '₹';
  document.getElementById('discount').value = data.discount || 0;
  document.getElementById('notes').value = data.notes || '';
  lineItemsEl.innerHTML = '';
  (data.items && data.items.length ? data.items : [{}, {}]).forEach(it => addRow(it.desc || '', it.qty ?? 1, it.rate ?? 0));
  calcTotals();
  closeHistory();
}

function currentTotal(){
  const state = getState();
  const subtotal = state.items.reduce((sum, it) => sum + (parseFloat(it.qty)||0) * (parseFloat(it.rate)||0), 0);
  const discount = parseFloat(state.discount) || 0;
  return Math.max(subtotal - discount, 0);
}

/* ---------- toast ---------- */

let toastTimer;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---------- history (localStorage) ---------- */

const HISTORY_KEY = 'invoicex_history';

function getHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch(e){ return []; }
}

function saveHistory(list){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  renderHistory();
}

function upsertHistoryEntry(status){
  const state = getState();
  const list = getHistory();
  const existing = list.find(e => e.invNum === state.invNum);
  const entry = {
    id: existing ? existing.id : (Date.now() + '-' + Math.random().toString(36).slice(2)),
    invNum: state.invNum || '(no number)',
    client: state.toName || '(no client)',
    date: state.issueDate || '',
    total: currentTotal(),
    currency: state.currency,
    status,
    delivered: existing ? existing.delivered : false,
    data: state
  };
  if(existing) Object.assign(existing, entry);
  else list.unshift(entry);
  saveHistory(list);
  return entry;
}

function saveDraft(){
  upsertHistoryEntry('draft');
  showToast('Draft saved.');
}

function hasInvoiceContent(state){
  return !!(state.invNum || state.toName || state.items.some(it => it.desc || (parseFloat(it.qty) > 0) || (parseFloat(it.rate) > 0)));
}

function preserveCurrentInvoice(){
  const state = getState();
  if(!hasInvoiceContent(state)) return false;
  const existing = getHistory().find(e => e.invNum === state.invNum);
  upsertHistoryEntry(existing ? existing.status : 'draft');
  return true;
}

function nextInvoiceNumber(curr){
  const m = curr.match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return curr;
  const [, prefix, num, suffix] = m;
  return prefix + String(Number(num) + 1).padStart(num.length, '0') + suffix;
}

function newInvoice(){
  const prevInvNum = document.getElementById('invNum').value;
  const kept = preserveCurrentInvoice();
  document.getElementById('invNum').value = prevInvNum ? nextInvoiceNumber(prevInvNum) : 'INV-0001';
  document.getElementById('toName').value = '';
  document.getElementById('toAddr').value = '';
  document.getElementById('toContact').value = '';
  document.getElementById('issueDate').value = formatDMY(new Date());
  const due = new Date();
  due.setDate(due.getDate() + 15);
  document.getElementById('dueDate').value = formatDMY(due);
  document.getElementById('discount').value = 0;
  document.getElementById('notes').value = '';
  lineItemsEl.innerHTML = '';
  addRow();
  addRow();
  calcTotals();
  closeHistory();
  showToast(kept ? 'Previous invoice kept in history. New invoice started.' : 'New invoice started.');
}

function loadHistoryEntry(id){
  const entry = getHistory().find(e => e.id === id);
  if(entry) loadState(entry.data);
}

function deleteHistoryEntry(id){
  saveHistory(getHistory().filter(e => e.id !== id));
}

function setDelivered(id, delivered){
  const list = getHistory();
  const entry = list.find(e => e.id === id);
  if(entry){ entry.delivered = delivered; saveHistory(list); }
}

function renderHistory(){
  const list = getHistory();
  const body = document.getElementById('historyBody');
  const empty = document.getElementById('historyEmpty');
  body.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';
  list.forEach(entry => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(entry.invNum)}</td>
      <td>${escapeHtml(entry.client)}</td>
      <td>${escapeHtml(entry.date)}</td>
      <td class="num">${escapeHtml(entry.currency)}${fmt(entry.total)}</td>
      <td><span class="status-pill ${entry.status}">${entry.status === 'draft' ? 'Draft' : 'Sent'}</span></td>
      <td><input type="checkbox" ${entry.delivered ? 'checked' : ''} ${entry.status === 'draft' ? 'disabled' : ''} onchange="setDelivered('${entry.id}', this.checked)"></td>
      <td>
        <button class="link-btn" onclick="loadHistoryEntry('${entry.id}')">Load</button>
        <button class="link-btn danger" onclick="deleteHistoryEntry('${entry.id}')">Delete</button>
      </td>
    `;
    body.appendChild(tr);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleHistory(){
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) renderHistory();
}

function closeHistory(){
  document.getElementById('historyPanel').classList.remove('open');
}

renderHistory();

/* ---------- Google Drive connection (client-side OAuth) ---------- */

const DRIVE_CLIENT_ID_KEY = 'invoicex_gdrive_client_id';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let driveTokenClient = null;
let driveAccessToken = null;
let driveTokenExpiry = 0;

function isDriveConfigured(){ return !!localStorage.getItem(DRIVE_CLIENT_ID_KEY); }
function isDriveConnected(){ return driveAccessToken && Date.now() < driveTokenExpiry; }

function updateDriveButton(){
  const btn = document.getElementById('driveBtn');
  if(isDriveConnected()){
    btn.textContent = 'Google Drive: Connected ✓';
    btn.classList.add('connected');
  } else {
    btn.textContent = 'Connect Google Drive';
    btn.classList.remove('connected');
  }
}

function toggleDriveConnection(){
  if(isDriveConnected()){
    driveAccessToken = null;
    driveTokenExpiry = 0;
    updateDriveButton();
    showToast('Disconnected from Google Drive.');
    return;
  }
  let clientId = localStorage.getItem(DRIVE_CLIENT_ID_KEY);
  if(!clientId){
    clientId = prompt('Enter your Google OAuth Client ID to enable saving PDFs to your Google Drive.\n(Create one at console.cloud.google.com — APIs & Services > Credentials.)');
    if(!clientId) return;
    localStorage.setItem(DRIVE_CLIENT_ID_KEY, clientId.trim());
    clientId = clientId.trim();
  }
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    showToast('Google sign-in script not loaded yet — try again in a moment.');
    return;
  }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if(resp.error){
        showToast('Google Drive connection failed: ' + resp.error);
        return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiry = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3300000);
      updateDriveButton();
      showToast('Connected to Google Drive.');
    },
  });
  driveTokenClient.requestAccessToken({ prompt: isDriveConfigured() ? '' : 'consent' });
}

function resetDriveClientId(){
  localStorage.removeItem(DRIVE_CLIENT_ID_KEY);
  driveAccessToken = null;
  driveTokenExpiry = 0;
  updateDriveButton();
}

async function uploadPdfToDrive(blob, filename){
  const metadata = { name: filename, mimeType: 'application/pdf' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + driveAccessToken },
    body: form
  });
  if(!res.ok){
    const text = await res.text();
    throw new Error('Drive upload failed (' + res.status + '): ' + text);
  }
  return res.json();
}

/* ---------- PDF generation + download + optional Drive save ---------- */

function generatePdfBlob(){
  const state = getState();
  // jsPDF's built-in fonts have no glyph for ₹ (renders as a stray mark) — spell it out instead.
  const pdfCurrency = state.currency === '₹' ? 'Rs. ' : state.currency;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 42;
  const rightX = pageWidth - margin;
  const bottomLimit = pageHeight - margin;
  const INK = [31, 36, 33];
  const INK_SOFT = [90, 95, 88];
  const ACCENT = [27, 75, 67];
  const LINE = [200, 193, 176];
  let y = margin;
  let onPageBreak = null;

  function ensureSpace(needed){
    if(y + needed > bottomLimit){
      pdf.addPage();
      y = margin;
      if(onPageBreak) onPageBreak();
    }
  }

  // header: business identity (left) + invoice tag (right)
  pdf.setFont('times', 'bold'); pdf.setFontSize(20); pdf.setTextColor(...INK);
  pdf.text(state.bizName || 'Your business name', margin, y + 16);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(...INK);
  let leftY = y + 34;
  if(state.bizAddr){ pdf.text(state.bizAddr, margin, leftY); leftY += 14; }
  if(state.bizContact){ pdf.text(state.bizContact, margin, leftY); leftY += 14; }

  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(...INK_SOFT);
  pdf.text('INVOICE', rightX, y + 8, { align: 'right' });
  pdf.setFont('courier', 'bold'); pdf.setFontSize(15); pdf.setTextColor(...ACCENT);
  pdf.text(state.invNum || '', rightX, y + 26, { align: 'right' });

  y = Math.max(leftY, y + 40) + 10;
  pdf.setDrawColor(...INK); pdf.setLineWidth(1.2);
  pdf.line(margin, y, rightX, y);
  y += 26;

  // billed by / billed to
  const colWidth = (pageWidth - margin * 2 - 24) / 2;
  const col2X = margin + colWidth + 24;
  const startY = y;

  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...INK_SOFT);
  pdf.text('BILLED BY', margin, y);
  pdf.text('BILLED TO', col2X, y);
  let byY = y + 16, toY = y + 16;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(11); pdf.setTextColor(...INK);
  [state.fromName, state.fromGSTless].filter(Boolean).forEach(line => { pdf.text(line, margin, byY); byY += 15; });
  [state.toName, state.toAddr, state.toContact].filter(Boolean).forEach(line => { pdf.text(line, col2X, toY); toY += 15; });
  y = Math.max(byY, toY, startY + 16) + 14;

  // dates
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...INK_SOFT);
  pdf.text('ISSUE DATE', margin, y);
  pdf.text('DUE DATE', col2X, y);
  y += 15;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(11); pdf.setTextColor(...INK);
  pdf.text(state.issueDate || '', margin, y);
  pdf.text(state.dueDate || '', col2X, y);
  y += 20;
  pdf.setDrawColor(...LINE); pdf.setLineWidth(0.75);
  pdf.line(margin, y, rightX, y);
  y += 22;

  // line items table
  const descX = margin;
  const descWidth = pageWidth - margin * 2 - 190;
  const qtyX = rightX - 170;
  const rateX = rightX - 95;
  const amtX = rightX;

  function drawTableHeader(){
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...INK_SOFT);
    pdf.text('DESCRIPTION', descX, y);
    pdf.text('QTY', qtyX, y, { align: 'right' });
    pdf.text('RATE', rateX, y, { align: 'right' });
    pdf.text('AMOUNT', amtX, y, { align: 'right' });
    y += 8;
    pdf.setDrawColor(...INK); pdf.setLineWidth(1);
    pdf.line(margin, y, rightX, y);
    y += 16;
  }

  ensureSpace(60);
  drawTableHeader();
  onPageBreak = drawTableHeader;

  let subtotal = 0;
  state.items.forEach(it => {
    const qty = parseFloat(it.qty) || 0;
    const rate = parseFloat(it.rate) || 0;
    const amount = qty * rate;
    subtotal += amount;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
    const descLines = pdf.splitTextToSize(it.desc || '', descWidth);
    const rowHeight = Math.max(descLines.length * 13, 13);

    ensureSpace(rowHeight + 14);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(...INK);
    pdf.text(descLines, descX, y);
    pdf.setFont('courier', 'normal'); pdf.setFontSize(9);
    pdf.text(String(qty), qtyX, y, { align: 'right' });
    pdf.text(fmt(rate), rateX, y, { align: 'right' });
    pdf.text(fmt(amount), amtX, y, { align: 'right' });

    y += rowHeight + 8;
    pdf.setDrawColor(...LINE); pdf.setLineWidth(0.5);
    pdf.line(margin, y, rightX, y);
    y += 16;
  });
  onPageBreak = null;

  // totals — label is placed relative to the *measured* value width so it can
  // never collide with the amount, regardless of how many digits or how wide
  // the currency label/font gets.
  function drawTotalRow(label, valueText, labelStyle, valueStyle){
    pdf.setFont(valueStyle.font, valueStyle.weight); pdf.setFontSize(valueStyle.size);
    const valueWidth = pdf.getTextWidth(valueText);
    pdf.setTextColor(...valueStyle.color);
    pdf.text(valueText, amtX, y, { align: 'right' });
    pdf.setFont(labelStyle.font, labelStyle.weight); pdf.setFontSize(labelStyle.size);
    pdf.setTextColor(...labelStyle.color);
    pdf.text(label, amtX - valueWidth - 16, y, { align: 'right' });
  }

  const discount = parseFloat(state.discount) || 0;
  const total = Math.max(subtotal - discount, 0);
  ensureSpace(70);
  drawTotalRow('Subtotal', pdfCurrency + fmt(subtotal),
    { font: 'helvetica', weight: 'normal', size: 11, color: INK_SOFT },
    { font: 'courier', weight: 'normal', size: 11, color: INK });
  y += 20;
  drawTotalRow('Discount', pdfCurrency + fmt(discount),
    { font: 'helvetica', weight: 'normal', size: 11, color: INK_SOFT },
    { font: 'courier', weight: 'normal', size: 11, color: INK });
  y += 14;
  pdf.setDrawColor(...INK); pdf.setLineWidth(1.2);
  pdf.line(amtX - 200, y, rightX, y);
  y += 24;
  drawTotalRow('Total due', pdfCurrency + fmt(total),
    { font: 'helvetica', weight: 'bold', size: 13, color: INK },
    { font: 'times', weight: 'bold', size: 16, color: ACCENT });
  y += 30;

  // notes
  if(state.notes){
    ensureSpace(40);
    pdf.setDrawColor(...LINE); pdf.setLineWidth(0.75);
    pdf.line(margin, y, rightX, y);
    y += 18;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...INK_SOFT);
    pdf.text('NOTES / PAYMENT TERMS', margin, y);
    y += 14;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
    const noteLines = pdf.splitTextToSize(state.notes, pageWidth - margin * 2);
    ensureSpace(noteLines.length * 13);
    pdf.setTextColor(...INK);
    pdf.text(noteLines, margin, y);
  }

  return pdf.output('blob');
}

async function handleDownloadPdf(event){
  const btn = event ? event.target : null;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing PDF…'; }
  try{
    if(typeof window.jspdf === 'undefined'){
      showToast('PDF library still loading — falling back to browser print.');
      window.print();
      return;
    }
    const state = getState();
    const filename = (state.invNum || 'invoice').replace(/[^a-z0-9-_]+/gi, '_') + '.pdf';
    const blob = generatePdfBlob();

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    upsertHistoryEntry('sent');

    if(isDriveConnected()){
      try{
        await uploadPdfToDrive(blob, filename);
        showToast('PDF downloaded and saved to Google Drive.');
      }catch(err){
        console.error(err);
        showToast('PDF downloaded, but Google Drive upload failed.');
      }
    } else {
      showToast('PDF downloaded. Connect Google Drive to also save it there.');
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

updateDriveButton();
